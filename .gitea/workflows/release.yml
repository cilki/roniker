name: Release
on:
  push:
    tags:
      - v*
permissions:
  contents: read
jobs:
  rust-release:
    runs-on: tcc-build
    container: rust:latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
    - name: Set up Node
      run: if ! command -v node >/dev/null; then case "$(uname -m)" in x86_64) arch=x64 ;; aarch64) arch=arm64 ;; *) echo "No Node.js build for $(uname -m)" >&2; exit 1 ;; esac; version=$(curl -fsSL https://nodejs.org/dist/index.tab | awk -F '\t' 'NR > 1 && $10 != "-" && !v { v = $1 } END { print v }'); tarball="node-$version-linux-$arch.tar.gz"; [ -n "$version" ] && curl -fsSL "https://nodejs.org/dist/$version/$tarball" -o "/tmp/$tarball" && (cd /tmp && curl -fsSL "https://nodejs.org/dist/$version/SHASUMS256.txt" | grep " $tarball\$" | sha256sum -c -) && mkdir -p /usr/local/lib/nodejs && tar -xzf "/tmp/$tarball" -C /usr/local/lib/nodejs --strip-components=1 && ln -sf /usr/local/lib/nodejs/bin/node /usr/local/bin/node && rm "/tmp/$tarball"; fi
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Trust the checkout
      run: if command -v git >/dev/null; then git config --global --add safe.directory "$GITHUB_WORKSPACE"; fi
    - name: Publish to crates.io
      run: cargo publish
    timeout-minutes: 15
