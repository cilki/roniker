[package]
authors = ["Tyler Cook"]
description = "Create custom LSPs for RON configurations at compile time."
edition = "2024"
license = "MIT"
name = "roniker"
repository = "https://github.com/fossable/roniker"
version = "0.4.0"
keywords = ["lsp", "ron", "language-server", "configuration", "ide"]
categories = ["development-tools", "text-editors", "config"]
readme = "README.md"

[dependencies]
anyhow = "1"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
strsim = { version = "0.11", optional = true }

# For LSP server
tower-lsp = { version = "0.20", optional = true }
# `tower-lsp` builds on `tower::Service` but doesn't re-export it, and `serve`
# needs to name the trait to wrap the service it hands to the server loop.
# `tower-service` is the crate that defines it, and is all of `tower` we need.
tower-service = { version = "0.3", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tree-sitter = { version = "0.25.10", optional = true }
ron-lsp-tree-sitter = { version = "0.1.0", optional = true }

# For type analysis
syn = { version = "2", features = [
  "full",
  "parsing",
  "extra-traits",
], optional = true }
quote = { version = "1", optional = true }
proc-macro2 = { version = "1", features = ["span-locations"], optional = true }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# The examples pull in optional dependencies, so they only compile with the
# relevant features enabled. Declaring the requirements here keeps a plain
# `cargo build`/`cargo test` (default features) from failing to compile them.
[[example]]
name = "simple_lsp"
required-features = ["lsp"]

[[example]]
name = "analyze_lsp"
required-features = ["analyze", "lsp"]


[features]
# Analyze Rust source files for type extraction
analyze = ["dep:syn", "dep:quote", "dep:proc-macro2"]

# Serve LSP
lsp = [
  "dep:tower-lsp",
  "dep:tower-service",
  "dep:tokio",
  "dep:tree-sitter",
  "dep:ron-lsp-tree-sitter",
  "dep:strsim",
]
